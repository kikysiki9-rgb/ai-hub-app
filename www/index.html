<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b10; --surface:#15151d; --surface2:#1d1d28;
  --border:#2a2a38; --text:#f0f0f5; --muted:#8a8a9a;
  --accent:#6d6dff; --red:#ff5c5c; --orange:#ffa84d; --green:#4ade80;
  --teal:#2dd4bf; --blue:#60a5fa;
  --theme-a:#6d6dff; --theme-b:#5a5aef;
  color-scheme: dark;
}
#splash{
  position:fixed; inset:0; z-index:999;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(11,11,16,.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  transition:opacity .6s ease, transform .6s ease;
}
#splash.hide{opacity:0; transform:scale(1.08); pointer-events:none;}
.splash-logo-wrap{position:relative; width:84px; height:84px; display:flex; align-items:center; justify-content:center; margin-bottom:22px;}
.splash-ring{position:absolute; inset:0; border-radius:50%; border:2px solid var(--theme-a); opacity:0; animation:ringPulse 2.2s ease-out infinite;}
.splash-ring:nth-child(2){animation-delay:.6s;}
.splash-ring:nth-child(3){animation-delay:1.2s;}
@keyframes ringPulse{0%{transform:scale(.6); opacity:.7;}100%{transform:scale(2.2); opacity:0;}}
.splash-logo{
  width:56px; height:56px; border-radius:50%; z-index:1;
  background:radial-gradient(circle at 35% 30%, #fff, var(--theme-a) 60%, var(--theme-b));
  box-shadow:0 0 40px var(--theme-a);
  display:flex; align-items:center; justify-content:center; font-size:24px; color:#0b0b10;
  animation:logoPulse 1.8s ease-in-out infinite;
}
@keyframes logoPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.splash-title{
  font-size:26px; font-weight:800; letter-spacing:.3px; margin-top:4px;
  background:linear-gradient(90deg,#fff,var(--theme-a));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  opacity:0; transform:translateY(14px);
  animation:splashUp .6s ease .3s forwards;
}
.splash-greet{
  font-size:14px; color:var(--muted); margin-top:8px;
  opacity:0; transform:translateY(10px);
  animation:splashUp .6s ease .55s forwards;
}
@keyframes splashUp{to{opacity:1; transform:translateY(0);}}
.empty-state{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:34px 10px 10px;}
.empty-state h2{font-size:18px; font-weight:700; margin:0;}
.empty-state p{font-size:13px; color:var(--muted); margin:0;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:8px;}
.chip{
  background:var(--surface2); border:1px solid var(--border); border-radius:16px; padding:9px 13px;
  font-size:12.5px; opacity:0; transform:translateY(8px);
  animation:chipIn .4s ease forwards;
}
@keyframes chipIn{to{opacity:1; transform:translateY(0);}}
.think-box{
  margin-bottom:8px; border:1px dashed var(--border); border-radius:10px; padding:8px 10px;
  font-size:12.5px; color:var(--muted);
}
.think-box summary{cursor:pointer; font-weight:600; color:var(--text);}
.reason-toggle{
  display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--muted);
  background:var(--surface2); border:1px solid var(--border); border-radius:50%; width:40px; height:40px; flex:0 0 auto;
  transition:color .15s ease, border-color .15s ease;
}
.reason-toggle.on{color:var(--theme-a); border-color:var(--theme-a); box-shadow:0 0 0 2px rgba(109,109,255,.2);}
.msg-text pre{background:#0b0b10; border:1px solid var(--border); border-radius:8px; padding:8px 10px; overflow-x:auto; font-size:12.5px; margin:6px 0;}
.msg-text code{font-family:ui-monospace,Menlo,monospace;}
.msg-text ul{margin:4px 0; padding-left:18px;}
.msg-text b{font-weight:700;}
.msg-text i{font-style:italic;}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex; flex-direction:column; height:100%;
  position:relative; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:-20% -20% auto -20%; height:70%;
  background:radial-gradient(circle at 30% 20%, var(--theme-a), transparent 60%),
             radial-gradient(circle at 80% 0%, var(--theme-b), transparent 55%);
  opacity:.28;
  filter:blur(40px); pointer-events:none; z-index:0;
  animation:drift 14s ease-in-out infinite alternate;
  transition:opacity .7s ease;
}
@keyframes drift{from{transform:translateY(0) scale(1);}to{transform:translateY(20px) scale(1.08);}}
header,.model-strip,main,footer{position:relative; z-index:1;}
header{
  padding:16px 18px 12px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:rgba(11,11,16,.7); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
header h1{
  font-size:18px; margin:0; font-weight:700; letter-spacing:.2px;
  background:linear-gradient(90deg,#fff,#b9b9ff);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.key-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--muted);
  font-size:12px; padding:7px 11px; border-radius:20px; display:flex; gap:6px; align-items:center;
  transition:transform .15s ease, border-color .15s ease;
}
.key-btn:active{transform:scale(.94); border-color:var(--accent);}
.model-strip{padding:10px 16px 4px;}
.model-pill{
  display:flex; align-items:center; gap:8px;
  background:linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.01)), var(--surface);
  border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:10px 14px;
  width:100%; transition:border-color .15s ease, transform .12s ease, box-shadow .15s ease;
  box-shadow:0 4px 16px rgba(0,0,0,.25);
}
.msg-row{display:flex; gap:8px; align-items:flex-end; max-width:92%;}
.avatar{
  width:26px; height:26px; border-radius:50%; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:800; color:#0b0d12; text-transform:uppercase;
  box-shadow:0 2px 8px rgba(0,0,0,.3);
}
.msg-row .msg.ai{max-width:none; flex:1;}
.model-pill:active{transform:scale(.98);}
.model-pill .mp-name{font-size:14px; font-weight:600; flex:1; text-align:left;}
.model-pill .mp-price{font-size:11px; color:var(--muted);}
.dot{
  width:8px; height:8px; border-radius:50%; display:inline-block;
  box-shadow:0 0 8px currentColor; flex:0 0 auto;
}
.provider-label{
  font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;
  padding:10px 2px 4px; display:flex; align-items:center; gap:6px; scroll-margin-top:10px;
}
.prov-tabs{display:flex; gap:6px; margin-bottom:8px; overflow-x:auto;}
.prov-tab{
  flex:0 0 auto; display:flex; align-items:center; gap:5px; padding:7px 12px;
  border-radius:16px; background:var(--surface2); border:1px solid var(--border);
  font-size:12.5px; font-weight:600;
}
.prov-tab:active{transform:scale(.95);}
.model-row{
  display:flex; align-items:center; gap:10px; padding:11px 10px; border-radius:12px;
  transition:background .2s ease, box-shadow .2s ease, transform .15s ease;
}
.model-row:active{background:var(--surface2); transform:scale(.98);}
.model-row.sel{background:var(--surface2); box-shadow:0 0 0 1px var(--accent) inset, 0 0 16px rgba(109,109,255,.2);}
.model-pill{transition:border-color .15s ease, transform .12s ease, box-shadow .2s ease;}
.model-pill:focus-within, .model-pill.pulse{box-shadow:0 0 0 3px rgba(109,109,255,.2);}
.model-pill.flash{box-shadow:0 0 0 3px var(--theme-a), 0 0 30px var(--theme-a);}
.msg.ai{position:relative; padding-right:56px;}
.copy-btn{
  position:absolute; top:8px; right:8px; background:none; border:none; color:var(--muted);
  font-size:13px; padding:2px; line-height:1;
}
.copy-btn.done{color:var(--green);}
html.no-tts .tts-btn{display:none;}
.drawer-bg{
  position:fixed; inset:0; background:rgba(0,0,0,0); z-index:30;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .25s ease, background .25s ease;
}
.drawer-bg.open{opacity:1; visibility:visible; pointer-events:auto; background:rgba(0,0,0,.55);}
.drawer{
  position:absolute; left:0; top:0; bottom:0; width:78%; max-width:300px;
  background:var(--surface); border-right:1px solid var(--border);
  transform:translateX(-100%); transition:transform .32s cubic-bezier(.19,1,.22,1);
  padding:16px 14px; padding-top:calc(16px + env(safe-area-inset-top,0px));
  overflow-y:auto; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
.drawer-bg.open .drawer{transform:translateX(0);}
.drawer h2{font-size:15px; margin:0 0 12px;}
.new-chat-btn{
  width:100%; background:var(--accent); color:#fff; border:none; border-radius:12px;
  padding:11px; font-size:13.5px; font-weight:600; margin-bottom:14px;
}
.chat-item{
  display:flex; align-items:center; gap:8px; padding:10px; border-radius:10px;
  margin-bottom:6px; background:var(--surface2); transition:box-shadow .2s ease;
}
.chat-item.active{box-shadow:0 0 0 1px var(--accent) inset;}
.chat-item .ci-title{flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.chat-item .ci-del{color:var(--red); padding:2px 6px;}
.preset-chip{
  background:var(--surface2); border:1px solid var(--border); border-radius:14px;
  padding:7px 10px; font-size:11.5px;
}
.regen-btn{
  align-self:flex-start; margin:-6px 0 4px 34px; background:none; border:none;
  color:var(--muted); font-size:11.5px; padding:2px 4px;
}
.arena-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--muted);
  font-size:12px; padding:9px 12px; border-radius:16px; margin-top:8px; width:100%;
  transition:color .15s ease, border-color .15s ease;
}
.arena-btn.on{color:var(--theme-a); border-color:var(--theme-a);}
.model-row .mn{font-size:14px; font-weight:600; flex:1;}
.model-row .mp{font-size:11px; color:var(--muted);}
main{flex:1; overflow-y:auto; padding:10px 16px 20px; display:flex; flex-direction:column; gap:12px;}
.msg{
  max-width:82%; padding:10px 14px; border-radius:16px; font-size:14.5px; line-height:1.4;
  animation:rise .28s ease both;
}
@keyframes rise{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:translateY(0);}}
.msg.user{
  align-self:flex-end; color:#fff; border-bottom-right-radius:4px;
  background:linear-gradient(135deg, var(--theme-a), var(--theme-b));
  box-shadow:0 4px 14px rgba(0,0,0,.3);
  transition:background .6s ease;
}
.msg.ai{
  align-self:flex-start; background:var(--surface); border:1px solid var(--border);
  border-bottom-left-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.msg-tag{font-size:10.5px; font-weight:700; letter-spacing:.3px; margin-bottom:4px; opacity:.85;}
.msg-text{white-space:pre-wrap;}
.hint{color:var(--muted); font-size:12px; text-align:center; margin-top:6px;}
.dots{display:inline-flex; gap:4px; align-items:center; height:14px;}
.dots span{
  width:6px; height:6px; border-radius:50%; background:var(--muted);
  animation:bounce 1.1s ease-in-out infinite;
}
.dots span:nth-child(2){animation-delay:.15s;}
.dots span:nth-child(3){animation-delay:.3s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0); opacity:.4;}40%{transform:translateY(-5px); opacity:1;}}
footer{
  padding:10px 12px; border-top:1px solid var(--border);
  background:rgba(11,11,16,.7); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  display:flex; gap:8px; align-items:center;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
}
#inp{
  flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text);
  border-radius:20px; padding:11px 16px; font-size:14.5px; outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
#inp:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(109,109,255,.2);}
#send{
  background:linear-gradient(135deg,#7a7aff,#5a5aef); border:none; color:#fff; width:42px; height:42px;
  border-radius:50%; font-size:16px; flex:0 0 auto;
  box-shadow:0 4px 14px rgba(109,109,255,.35);
  transition:transform .12s ease;
}
#send:active{transform:scale(.88);}
.modal-bg{
  position:fixed; inset:0; background:rgba(0,0,0,0); display:flex;
  align-items:flex-end; justify-content:center; z-index:20;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .25s ease, background .25s ease;
}
.modal-bg.open{
  opacity:1; visibility:visible; pointer-events:auto;
  background:rgba(0,0,0,.6);
}
.modal{
  background:var(--surface); width:100%; max-width:480px; border-radius:20px 20px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.19,1,.22,1);
  box-shadow:0 -10px 40px rgba(0,0,0,.4);
}
.modal-bg.open .modal{transform:translateY(0);}
.modal h2{margin:0 0 12px; font-size:16px;}
.modal input, .modal textarea{
  width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text);
  padding:12px 14px; border-radius:12px; font-size:14px; margin-bottom:10px;
  font-family:inherit;
}
.modal textarea{resize:vertical; min-height:110px; line-height:1.4;}
.modal .sub{color:var(--muted); font-size:12px; margin:-4px 0 10px;}
.key-row{
  display:flex; align-items:center; gap:10px; padding:10px; border-radius:12px;
  background:var(--surface2); border:1px solid var(--border); margin-bottom:8px;
  transition:box-shadow .2s ease;
}
.key-row.active{box-shadow:0 0 0 1px var(--accent) inset;}
.key-row .kr-info{flex:1; min-width:0;}
.key-row .kr-label{font-size:13px; font-weight:600;}
.key-row .kr-sub{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.key-row .kr-del{color:var(--red); font-size:18px; padding:4px 8px;}
.add-key-toggle{
  text-align:center; font-size:13px; color:var(--accent); padding:8px; margin-bottom:6px;
}
.modal button.save{
  width:100%; background:var(--accent); border:none; color:#fff; padding:13px; border-radius:12px; font-size:14.5px; font-weight:600;
}
.modal .close{display:block; text-align:center; color:var(--muted); font-size:13px; margin-top:12px; padding:6px;}
#imgPreviewBar{
  display:none; align-items:center; gap:8px; padding:8px 14px;
  background:rgba(11,11,16,.7); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
}
#imgPreviewBar img{width:40px; height:40px; object-fit:cover; border-radius:8px;}
#imgPreviewBar span{font-size:12px; color:var(--muted);}
#imgPreviewBar button{margin-left:auto; background:none; border:none; color:var(--muted); font-size:15px; padding:4px;}
.msg.user img{max-width:100%; border-radius:12px; display:block; margin-bottom:6px;}
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo-wrap">
    <div class="splash-ring"></div><div class="splash-ring"></div><div class="splash-ring"></div>
    <div class="splash-logo">✦</div>
  </div>
  <div class="splash-title">AI Hub</div>
  <div class="splash-greet" id="splashGreet"></div>
</div>

<header>
  <button class="key-btn" onclick="openDrawer()">☰</button>
  <h1 style="flex:1; text-align:center;">🧠 AI Hub</h1>
  <div style="display:flex; gap:8px;">
    <button class="key-btn" onclick="clearChat()" title="Очистить чат">🗑️</button>
    <button class="key-btn" onclick="openProfileModal()">👤 Профиль</button>
    <button class="key-btn" onclick="openKeyModal()">🔑 Ключ</button>
  </div>
</header>

<div class="drawer-bg" id="drawer" onclick="if(event.target===this)closeDrawer()">
  <div class="drawer">
    <h2>Чаты</h2>
    <button class="new-chat-btn" onclick="newChat()">+ Новый чат</button>
    <div id="chatList"></div>
  </div>
</div>

<div class="model-strip">
  <button class="model-pill" id="currentModelBtn" onclick="openModelSheet('A')"></button>
  <button class="arena-btn" id="arenaBtn" onclick="toggleArena()">⚔️ Баттл моделей</button>
  <button class="model-pill" id="modelBBtn" onclick="openModelSheet('B')" style="display:none; margin-top:8px;"></button>
</div>

<div class="modal-bg" id="modelSheet">
  <div class="modal" style="max-height:70vh; overflow-y:auto;">
    <h2>Выбор модели</h2>
    <div id="modelList"></div>
    <span class="close" onclick="document.getElementById('modelSheet').classList.remove('open')">Закрыть</span>
  </div>
</div>

<main id="chat"></main>

<div id="imgPreviewBar"></div>
<footer>
  <input type="file" accept="image/*" id="imgInput" style="display:none" onchange="handleImagePick(event)">
  <button class="reason-toggle" onclick="document.getElementById('imgInput').click()" title="Прикрепить фото">📎</button>
  <button class="reason-toggle" id="reasonBtn" onclick="toggleReasoning()" title="Показывать ход рассуждений">🧠</button>
  <input id="inp" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter')sendMsg()">
  <button id="send" onclick="sendMsg()">➤</button>
</footer>

<div class="modal-bg" id="profileModal">
  <div class="modal">
    <h2>Профиль</h2>
    <p class="sub">Этот текст будет отправляться модели перед каждым твоим сообщением — задаёт её поведение и характер (действует для всех моделей).</p>
    <div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
      <button type="button" class="preset-chip" onclick="setPreset('dev')">💻 Сеньор-разработчик</button>
      <button type="button" class="preset-chip" onclick="setPreset('short')">⚡ Кратко и по делу</button>
      <button type="button" class="preset-chip" onclick="setPreset('translate')">🌍 Переводчик</button>
      <button type="button" class="preset-chip" onclick="setPreset('rude')">😈 Дерзкий ассистент</button>
    </div>
    <textarea id="systemPromptInput" placeholder="Например: Отвечай кратко, по-дружески, на русском..."></textarea>
    <button class="save" onclick="saveProfile()">Сохранить</button>
    <span class="close" onclick="document.getElementById('profileModal').classList.remove('open')">Отмена</span>
  </div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2 id="keyModalTitle">Ключи</h2>
    <div id="keyList"></div>
    <div class="add-key-toggle" onclick="document.getElementById('addKeyForm').style.display='block'; this.style.display='none';">+ Добавить ключ</div>
    <div id="addKeyForm" style="display:none;">
      <input placeholder="Название (например: основной)" id="keyLabelInput">
      <input placeholder="sk-..." id="keyInput">
      <input placeholder="Base URL (https://...)" id="urlInput">
      <button class="save" onclick="addKey()">Добавить</button>
    </div>
    <p id="modelLabel" style="color:var(--muted); font-size:12px; margin:10px 0 0;">Слаг модели</p>
    <input placeholder="например claude-opus-5" id="modelInput" onchange="saveSlug()">
    <span class="close" onclick="document.getElementById('modal').classList.remove('open')">Готово</span>
  </div>
</div>

<script>
const models=[
  {n:"Fable 5.1",prov:"Claude",c:"red",p:"x8",slug:"claude-fable-5-2"},
  {n:"Fable 5",prov:"Claude",c:"red",p:"x8",slug:"claude-fable-5"},
  {n:"Opus 5/4",prov:"Claude",c:"orange",p:"x4",slug:"claude-opus-5-5"},
  {n:"Sonnet 5",prov:"Claude",c:"green",p:"x2",slug:"claude-sonnet-5"},
  {n:"ChatGPT 6.2 Astra",prov:"OpenAI",c:"red",p:"x8",slug:"gpt-6.2-astra"},
  {n:"ChatGPT 6 Astra",prov:"OpenAI",c:"red",p:"x10",slug:"gpt-6-astra"},
  {n:"ChatGPT 6.2 Sol",prov:"OpenAI",c:"teal",p:"x3",slug:"gpt-6.2-sol"},
  {n:"ChatGPT 6.1 Terra",prov:"OpenAI",c:"teal",p:"x1.5",slug:"gpt-6.1-terra"},
  {n:"ChatGPT 6 Sol",prov:"OpenAI",c:"teal",p:"x3",slug:"gpt-6-sol"},
  {n:"ChatGPT 6 Luna",prov:"OpenAI",c:"teal",p:"x0.45",slug:"gpt-6-luna"},

  if(file.size > 4*1024*1024){

  const reader=new FileReader();
  reader.onload=()=>{

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function mdRender(raw){
  let text=escapeHtml(raw);
  text=text.replace(/```([\s\S]*?)```/g,(m,code)=>{
    const lines=code.split('\n');
    if(lines[0] && !lines[0].includes(' ') && lines[0].trim().length<20) lines.shift();
    return '<pre><code>'+lines.join('\n').trim()+'</code></pre>';
  });
  text=text.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  text=text.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,'$1<i>$2</i>');
  text=text.replace(/(?:^|\n)[-*] (.+)(?=\n|$)/g,'\n<li>$1</li>');
  text=text.replace(/(<li>[\s\S]*?<\/li>(\n<li>[\s\S]*?<\/li>)*)/g,'<ul>$1</ul>');
  const parts=text.split(/(<pre>[\s\S]*?<\/pre>)/g);
  for(let i=0;i<parts.length;i++){
    if(!parts[i].startsWith('<pre>')) parts[i]=parts[i].replace(/\n/g,'<br>');
  }
  return parts.join('');
}
function extractThink(raw){
  const m=raw.match(/<think>([\s\S]*?)<\/think>/i);
  if(!m) return {think:null, rest:raw};
  return {think:m[1].trim(), rest:(raw.slice(0,m.index)+raw.slice(m.index+m[0].length)).trim()};
}
function renderAiText(container,raw){
  const {think,rest}=extractThink(raw);
  container.innerHTML='';
  if(think){
    const det=document.createElement('details');
    det.className='think-box';
    det.innerHTML='<summary>💭 Ход мыслей</summary><div></div>';
    det.querySelector('div').innerHTML=mdRender(think);
    container.appendChild(det);
  }
  const body=document.createElement('div');
  body.innerHTML=mdRender(rest);
  container.appendChild(body);
}
function copyMsg(btn){
  const bubble=btn.closest('.msg');
  const textEl=bubble&&bubble.querySelector('.msg-text');
  const txt=textEl?textEl.innerText:'';
  if(!txt||!navigator.clipboard)return;
  navigator.clipboard.writeText(txt).then(()=>{
    btn.textContent='✓'; btn.classList.add('done');
    setTimeout(()=>{btn.textContent='📋'; btn.classList.remove('done');},1200);
  }).catch(()=>{});
}

function addMsg(role,text,tag,tagColor){
  const chat=document.getElementById('chat');
  const emptyEl=chat.querySelector('.empty-state');
  if(emptyEl) emptyEl.remove();
  if(role==='ai'){
    const row=document.createElement('div');
    row.className='msg-row';
    const avatar=document.createElement('div');
    avatar.className='avatar';
    avatar.style.background=tagColor?`linear-gradient(135deg, ${tagColor}, #ffffff80)`:'var(--surface2)';
    avatar.textContent=tag?tag.charAt(0):'✦';
    const bubble=document.createElement('div');
    bubble.className='msg ai';
    bubble.innerHTML=(tag?`<div class="msg-tag" style="color:${tagColor||'var(--muted)'}">${tag}</div>`:'')
      +'<div class="msg-text"></div>'
      +'<button class="copy-btn tts-btn" style="right:32px" onclick="speakMsg(this)">🔊</button>'
      +'<button class="copy-btn" onclick="copyMsg(this)">📋</button>';
    bubble.querySelector('.msg-text').textContent=text;
    row.appendChild(avatar);
    row.appendChild(bubble);
    chat.appendChild(row);
    chat.scrollTop=chat.scrollHeight;
    return bubble;
  }else{
    const el=document.createElement('div');
    el.className='msg user';
    if(Array.isArray(text)){
      const imgBlock=text.find(b=>b.type==='image');
      const textBlock=text.find(b=>b.type==='text');
      if(imgBlock){
        const img=document.createElement('img');
        img.src='data:'+imgBlock.source.media_type+';base64,'+imgBlock.source.data;
        el.appendChild(img);
      }
      if(textBlock && textBlock.text){
        const tdiv=document.createElement('div');
        tdiv.textContent=textBlock.text;
        el.appendChild(tdiv);
      }
    }else{
      el.textContent=text;
    }
    chat.appendChild(el);
    chat.scrollTop=chat.scrollHeight;
    return el;
  }
}

function buildPrefixedContent(content){
  let parts=[];
  if(systemPrompt) parts.push('[Системная роль и стиль ответа: '+systemPrompt+']');
  if(reasoningOn) parts.push('[Сначала помести ход рассуждений в теги <think>...</think>, затем дай финальный ответ без повтора рассуждений]');
  const prefix = parts.length ? parts.join('\n')+'\n\n' : '';
  if(Array.isArray(content)){
    return content.map(b=> b.type==='text' ? {type:'text', text: prefix+b.text} : b);
  }
  return prefix+content;
}

async function callModel(model, apiMessages){
  const store=getProvStore(model.prov);
  const c=store.list[store.active];
  if(!c||!c.key||!c.url){
    return {error:'Для '+model.prov+' ещё не задан ключ. Нажми 🔑 Ключ и добавь его для этого провайдера.'};
  }
  try{
    const res=await fetch(c.url+'/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':c.key,
        'anthropic-version':'2023-06-01'
      },
      body:JSON.stringify(Object.assign(
        {model:model.slug, max_tokens:1536, messages:apiMessages},
        systemPrompt ? {system:systemPrompt} : {}
      ))
    });
    const data=await res.json();
    if(data.error) return {error:'Ошибка: '+(data.error.message||JSON.stringify(data.error))};
    let reply='';
    if(Array.isArray(data.content)){
      reply=data.content.filter(b=>b.type==='text').map(b=>b.text).join('\n');
    }
    return {reply: reply || null, raw:data};
  }catch(e){
    return {error:'Не получилось связаться с сервером: '+e.message};
  }
}

async function sendMsg(){
  const inp=document.getElementById('inp');
  const text=inp.value.trim();
  if(!text && !pendingImage)return;

  let userContent;
  if(pendingImage){
    userContent=[
      {type:'image', source:{type:'base64', media_type:pendingImage.mediaType, data:pendingImage.data}},
      {type:'text', text: text || 'Что изображено на фото? Реши это задание, если это задача.'}
    ];
  }else{
    userContent=text;
  }

  inp.value='';
  removePendingImage();
  addMsg('user',userContent);
  setChatTitle(text || '📷 Фото');

  if(arenaOn && modelBIndex!==null){
    await sendArenaMsg(text);
    return;
  }

  const model=models[selectedModelIndex];
  history.push({role:'user',content:userContent});
  const pmeta=providerMeta[model.prov]||{};
  const thinking=addMsg('ai','',model.prov+' · '+model.n,pmeta.color);
  thinking.querySelector('.msg-text').innerHTML='<span class="dots"><span></span><span></span><span></span></span>';

  const apiMessages = history.slice(0,-1).map(m=>({role:m.role,content:m.content}))
    .concat([{role:'user',content:buildPrefixedContent(userContent)}]);

  const res=await callModel(model, apiMessages);
  if(res.error){
    setMsgText(thinking,res.error);
    persistState();
    return;
  }
  setMsgText(thinking, res.reply || 'Пустой ответ от сервера: '+JSON.stringify(res.raw));
  if(res.reply){
    history.push({role:'assistant',content:res.reply,tag:model.prov+' · '+model.n,tagColor:pmeta.color});
    const row=thinking.closest('.msg-row');
    if(row) addRegenerateControl(row,text);
  }
  persistState();
}

async function sendArenaMsg(text){
  const modelA=models[selectedModelIndex];
  const modelB=models[modelBIndex];
  history.push({role:'user',content:text});
  const baseMessages = history.slice(0,-1).map(m=>({role:m.role,content:m.content}))
    .concat([{role:'user',content:buildPrefixedContent(text)}]);

  const pmetaA=providerMeta[modelA.prov]||{};
  const pmetaB=providerMeta[modelB.prov]||{};
  const thinkingA=addMsg('ai','',modelA.prov+' · '+modelA.n,pmetaA.color);
  thinkingA.querySelector('.msg-text').innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  const thinkingB=addMsg('ai','',modelB.prov+' · '+modelB.n,pmetaB.color);
  thinkingB.querySelector('.msg-text').innerHTML='<span class="dots"><span></span><span></span><span></span></span>';

  const [resA,resB]=await Promise.all([callModel(modelA,baseMessages), callModel(modelB,baseMessages)]);

  setMsgText(thinkingA, resA.error || resA.reply || 'Пустой ответ.');
  if(resA.reply) history.push({role:'assistant',content:resA.reply,tag:modelA.prov+' · '+modelA.n,tagColor:pmetaA.color});

  setMsgText(thinkingB, resB.error || resB.reply || 'Пустой ответ.');
  if(resB.reply) history.push({role:'assistant',content:resB.reply,tag:modelB.prov+' · '+modelB.n,tagColor:pmetaB.color});

  const row=thinkingB.closest('.msg-row');
  if(row) addRegenerateControl(row,text);
  persistState();
}
</script>
