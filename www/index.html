<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b10; --surface:#15151d; --surface2:#1d1d28;
  --border:#2a2a38; --text:#f0f0f5; --muted:#8a8a9a;
  --accent:#6d6dff; --red:#ff5c5c; --orange:#ffa84d; --green:#4ade80;
  --teal:#2dd4bf; --blue:#60a5fa;
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  background:var(--bg); color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex; flex-direction:column; height:100%;
  position:relative; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:-20% -20% auto -20%; height:70%;
  background:radial-gradient(circle at 30% 20%, rgba(109,109,255,.28), transparent 60%),
             radial-gradient(circle at 80% 0%, rgba(255,92,92,.18), transparent 55%);
  filter:blur(40px); pointer-events:none; z-index:0;
  animation:drift 14s ease-in-out infinite alternate;
}
@keyframes drift{from{transform:translateY(0) scale(1);}to{transform:translateY(20px) scale(1.08);}}
header,.model-strip,main,footer{position:relative; z-index:1;}
header{
  padding:16px 18px 12px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  background:rgba(11,11,16,.7); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
}
header h1{
  font-size:18px; margin:0; font-weight:700; letter-spacing:.2px;
  background:linear-gradient(90deg,#fff,#b9b9ff);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.key-btn{
  background:var(--surface2); border:1px solid var(--border); color:var(--muted);
  font-size:12px; padding:7px 11px; border-radius:20px; display:flex; gap:6px; align-items:center;
  transition:transform .15s ease, border-color .15s ease;
}
.key-btn:active{transform:scale(.94); border-color:var(--accent);}
.model-strip{padding:10px 16px 4px;}
.model-pill{
  display:flex; align-items:center; gap:8px; background:var(--surface);
  border:1px solid var(--border); border-radius:20px; padding:9px 14px;
  width:100%; transition:border-color .15s ease, transform .12s ease;
}
.model-pill:active{transform:scale(.98);}
.model-pill .mp-name{font-size:14px; font-weight:600; flex:1; text-align:left;}
.model-pill .mp-price{font-size:11px; color:var(--muted);}
.dot{
  width:8px; height:8px; border-radius:50%; display:inline-block;
  box-shadow:0 0 8px currentColor; flex:0 0 auto;
}
.provider-label{
  font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;
  padding:10px 2px 4px;
}
.model-row{
  display:flex; align-items:center; gap:10px; padding:11px 10px; border-radius:12px;
  transition:background .2s ease, box-shadow .2s ease, transform .15s ease;
}
.model-row:active{background:var(--surface2); transform:scale(.98);}
.model-row.sel{background:var(--surface2); box-shadow:0 0 0 1px var(--accent) inset, 0 0 16px rgba(109,109,255,.2);}
.model-pill{transition:border-color .15s ease, transform .12s ease, box-shadow .2s ease;}
.model-pill:focus-within, .model-pill.pulse{box-shadow:0 0 0 3px rgba(109,109,255,.2);}
.model-row .mn{font-size:14px; font-weight:600; flex:1;}
.model-row .mp{font-size:11px; color:var(--muted);}
main{flex:1; overflow-y:auto; padding:10px 16px 20px; display:flex; flex-direction:column; gap:12px;}
.msg{
  max-width:82%; padding:10px 14px; border-radius:16px; font-size:14.5px; line-height:1.4;
  animation:rise .28s ease both;
}
@keyframes rise{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:translateY(0);}}
.msg.user{
  align-self:flex-end; color:#fff; border-bottom-right-radius:4px;
  background:linear-gradient(135deg,#7a7aff,#5a5aef);
  box-shadow:0 4px 14px rgba(109,109,255,.3);
}
.msg.ai{
  align-self:flex-start; background:var(--surface); border:1px solid var(--border);
  border-bottom-left-radius:4px; box-shadow:0 2px 10px rgba(0,0,0,.25);
}
.hint{color:var(--muted); font-size:12px; text-align:center; margin-top:6px;}
footer{
  padding:10px 12px; border-top:1px solid var(--border);
  background:rgba(11,11,16,.7); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  display:flex; gap:8px; align-items:center;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
}
#inp{
  flex:1; background:var(--surface); border:1px solid var(--border); color:var(--text);
  border-radius:20px; padding:11px 16px; font-size:14.5px; outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
}
#inp:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(109,109,255,.2);}
#send{
  background:linear-gradient(135deg,#7a7aff,#5a5aef); border:none; color:#fff; width:42px; height:42px;
  border-radius:50%; font-size:16px; flex:0 0 auto;
  box-shadow:0 4px 14px rgba(109,109,255,.35);
  transition:transform .12s ease;
}
#send:active{transform:scale(.88);}
.modal-bg{
  position:fixed; inset:0; background:rgba(0,0,0,0); display:flex;
  align-items:flex-end; justify-content:center; z-index:20;
  opacity:0; visibility:hidden; pointer-events:none;
  transition:opacity .25s ease, background .25s ease;
}
.modal-bg.open{
  opacity:1; visibility:visible; pointer-events:auto;
  background:rgba(0,0,0,.6);
}
.modal{
  background:var(--surface); width:100%; max-width:480px; border-radius:20px 20px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.19,1,.22,1);
  box-shadow:0 -10px 40px rgba(0,0,0,.4);
}
.modal-bg.open .modal{transform:translateY(0);}
.modal h2{margin:0 0 12px; font-size:16px;}
.modal input{
  width:100%; background:var(--surface2); border:1px solid var(--border); color:var(--text);
  padding:12px 14px; border-radius:12px; font-size:14px; margin-bottom:10px;
}
.modal button.save{
  width:100%; background:var(--accent); border:none; color:#fff; padding:13px; border-radius:12px; font-size:14.5px; font-weight:600;
}
.modal .close{display:block; text-align:center; color:var(--muted); font-size:13px; margin-top:12px; padding:6px;}
</style>
</head>
<body>

<header>
  <h1>🧠 AI Hub</h1>
  <button class="key-btn" onclick="openKeyModal()">🔑 Ключ</button>
</header>

<div class="model-strip">
  <button class="model-pill" id="currentModelBtn" onclick="openModelSheet()"></button>
</div>

<div class="modal-bg" id="modelSheet">
  <div class="modal" style="max-height:70vh; overflow-y:auto;">
    <h2>Выбор модели</h2>
    <div id="modelList"></div>
    <span class="close" onclick="document.getElementById('modelSheet').classList.remove('open')">Закрыть</span>
  </div>
</div>

<main id="chat">
  <div class="msg ai">Привет! Выбери модель сверху и напиши сообщение. Это дизайн-демо — ответы здесь не настоящие, экран собран, чтобы оценить стиль перед сборкой рабочего APK.</div>
</main>

<footer>
  <input id="inp" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter')sendMsg()">
  <button id="send" onclick="sendMsg()">➤</button>
</footer>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h2>Добавить API-ключ</h2>
    <input placeholder="sk-..." id="keyInput">
    <input placeholder="Base URL (https://ai.starimg.ru)" id="urlInput">
    <p id="modelLabel" style="color:var(--muted); font-size:12px; margin:4px 0;">Слаг модели</p>
    <input placeholder="например claude-opus-5" id="modelInput">
    <button class="save" onclick="saveKey()">Сохранить</button>
    <span class="close" onclick="document.getElementById('modal').classList.remove('open')">Отмена</span>
  </div>
</div>

<script>
const models=[
  {n:"Fable 5.1",prov:"Claude",c:"red",p:"x8",slug:"claude-fable-5-2"},
  {n:"Fable 5",prov:"Claude",c:"red",p:"x8",slug:"claude-fable-5"},
  {n:"Opus 5/4",prov:"Claude",c:"orange",p:"x4",slug:"claude-opus-5-5"},
  {n:"Sonnet 5",prov:"Claude",c:"green",p:"x2",slug:"claude-sonnet-5"},
  {n:"GPT-6.2 Astra",prov:"OpenAI",c:"teal",p:"x8",slug:"gpt-6.2-astra"},
  {n:"GPT-6.2 Sol",prov:"OpenAI",c:"teal",p:"x3",slug:"gpt-6.2-sol"},
  {n:"GPT-6.1 Terra",prov:"OpenAI",c:"teal",p:"x2",slug:"gpt-6.1-terra"},
  {n:"Gemini 4 Argon",prov:"Gemini",c:"blue",p:"x6",slug:"gemini-4-argon"},
  {n:"Gemini 3.8 Flash",prov:"Gemini",c:"blue",p:"x1",slug:"gemini-3.8-flash"},
];
let selectedModelIndex=3;
let apiKey='', baseUrl='';
let history=[];
restoreState();

function renderCurrentPill(){
  const m=models[selectedModelIndex];
  document.getElementById('currentModelBtn').innerHTML=
    `<span class="dot" style="background:var(--${m.c})"></span><span class="mp-name">${m.n}</span><span class="mp-price">${m.prov} · цена ${m.p}</span>`;
}

function openModelSheet(){
  const list=document.getElementById('modelList');
  list.innerHTML='';
  const providers=[...new Set(models.map(m=>m.prov))];
  providers.forEach(prov=>{
    const label=document.createElement('div');
    label.className='provider-label';
    label.textContent=prov;
    list.appendChild(label);
    models.forEach((m,i)=>{
      if(m.prov!==prov)return;
      const row=document.createElement('div');
      row.className='model-row'+(i===selectedModelIndex?' sel':'');
      row.innerHTML=`<span class="dot" style="background:var(--${m.c})"></span><span class="mn">${m.n}</span><span class="mp">x${m.p.replace('x','')}</span>`;
      row.onclick=()=>{
        selectedModelIndex=i;
        renderCurrentPill();
        persistState();
        document.getElementById('modelSheet').classList.remove('open');
      };
      list.appendChild(row);
    });
  });
  document.getElementById('modelSheet').classList.add('open');
}
renderCurrentPill();

if(history.length){
  const chat=document.getElementById('chat');
  history.forEach(m=>{
    const el=document.createElement('div');
    el.className='msg '+(m.role==='user'?'user':'ai');
    el.textContent=m.content;
    chat.appendChild(el);
  });
  chat.scrollTop=chat.scrollHeight;
}

function persistState(){
  try{
    localStorage.setItem('aihub_state', JSON.stringify({
      apiKey, baseUrl, selectedModelIndex, models, history
    }));
  }catch(e){}
}

function restoreState(){
  try{
    const raw=localStorage.getItem('aihub_state');
    if(!raw)return;
    const s=JSON.parse(raw);
    apiKey=s.apiKey||'';
    baseUrl=s.baseUrl||'';
    selectedModelIndex=typeof s.selectedModelIndex==='number'?s.selectedModelIndex:selectedModelIndex;
    if(Array.isArray(s.models)){
      s.models.forEach((sm,i)=>{ if(models[i]&&sm.slug) models[i].slug=sm.slug; });
    }
    if(Array.isArray(s.history)) history=s.history;
  }catch(e){}
}

function openKeyModal(){
  document.getElementById('keyInput').value=apiKey;
  document.getElementById('urlInput').value=baseUrl;
  document.getElementById('modelInput').value=models[selectedModelIndex].slug;
  document.getElementById('modelLabel').textContent='Слаг модели: '+models[selectedModelIndex].n;
  document.getElementById('modal').classList.add('open');
}

function saveKey(){
  apiKey=document.getElementById('keyInput').value.trim();
  baseUrl=document.getElementById('urlInput').value.trim().replace(/\/$/,'');
  const slug=document.getElementById('modelInput').value.trim();
  if(slug) models[selectedModelIndex].slug=slug;
  persistState();
  document.getElementById('modal').classList.remove('open');
}

function addMsg(role,text){
  const chat=document.getElementById('chat');
  const el=document.createElement('div');
  el.className='msg '+(role==='user'?'user':'ai');
  el.textContent=text;
  chat.appendChild(el);
  chat.scrollTop=chat.scrollHeight;
  return el;
}

async function sendMsg(){
  const inp=document.getElementById('inp');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  addMsg('user',text);

  if(!apiKey||!baseUrl){
    addMsg('ai','Сначала нажми 🔑 Ключ сверху и заполни ключ и Base URL.');
    return;
  }

  const modelSlug=models[selectedModelIndex].slug;
  history.push({role:'user',content:text});
  const thinking=addMsg('ai','...');

  try{
    const res=await fetch(baseUrl+'/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':apiKey,
        'anthropic-version':'2023-06-01'
      },
      body:JSON.stringify({model:modelSlug, max_tokens:1024, messages:history})
    });
    const data=await res.json();
    if(data.error){
      thinking.textContent='Ошибка: '+(data.error.message||JSON.stringify(data.error));
      return;
    }
    const reply=data.content && data.content[0] && data.content[0].text;
    thinking.textContent=reply || 'Пустой ответ от сервера: '+JSON.stringify(data);
    if(reply) history.push({role:'assistant',content:reply});
    persistState();
  }catch(e){
    thinking.textContent='Не получилось связаться с сервером: '+e.message;
  }
}
</script>
</body>
</html>
